<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Redes Sociales - CEPOCS</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <!-- COPIA TU MISMO HEADER AQUÍ -->
</header>

<section class="container">
  <h2 class="section-title">Redes Sociales</h2>
  <p class="section-sub">
    Últimas publicaciones de CEPOCS en Facebook e Instagram
  </p>

  <!-- FACEBOOK -->
  <div style="margin-top:30px">
    <h3>Facebook</h3>

    <iframe
      src="https://www.facebook.com/plugins/page.php?
      href=https://www.facebook.com/cepocs.cepocs/
      &tabs=timeline
      &width=500
      &height=600
      &small_header=false
      &adapt_container_width=true
      &hide_cover=false
      &show_facepile=true"
      width="100%"
      height="600"
      style="border:none;overflow:hidden"
      scrolling="no"
      frameborder="0"
      allowfullscreen>
    </iframe>
  </div>

  <!-- INSTAGRAM -->
  <div style="margin-top:50px">
    <h3>Instagram</h3>

    <p style="margin-bottom:10px">
      Ver publicaciones en Instagram:
    </p>

    <a class="btn btn-primary"
       href="https://www.instagram.com/cepocs/"
       target="_blank">
       Ir a Instagram CEPOCS
    </a>

    <p style="margin-top:15px;font-size:0.85rem">
      (Instagram no permite feed completo sin API oficial o herramientas externas)
    </p>
  </div>

</section>

<footer>
  <!-- COPIA TU FOOTER -->
</footer>

</body>
</html>
