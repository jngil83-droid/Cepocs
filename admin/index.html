<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Administración | CEPOCS</title>
  
  <!-- Cargamos tu script local para saltar el bloqueo de Cloudflare -->
  <script type="module" src="./decap-cms.js"></script>
</head>
<body>
  <script>
    // Inicializamos directamente en el objeto global para evitar fallos de renderizado en el DOM
    window.CMS_MANUAL_INIT = true;

    window.addEventListener('load', () => {
      if (typeof CMS !== 'undefined') {
        CMS.init({
          config: {
            backend: {
              name: 'github',
              repo: 'jngil83-droid/Cepocs',
              branch: 'main',
              local_backend: true
            },
            media_folder: 'assets/img/noticias',
            public_folder: '/assets/img/noticias',
            collections: [
              {
                name: 'noticias',
                label: 'Noticias',
                folder: 'content/noticias',
                create: true,
                slug: '{{year}}-{{month}}-{{day}}-{{slug}}',
                format: 'json',
                fields: [
                  { label: 'Titular', name: 'title', widget: 'string' },
                  { label: 'Fecha de Publicación', name: 'date', widget: 'datetime', format: 'YYYY-MM-DD' },
                  { label: 'Autor/a', name: 'author', widget: 'string', default: 'CEPOCS' },
                  { label: 'Foto de Portada', name: 'image', widget: 'image', required: true },
                  { label: 'Resumen Corto', name: 'description', widget: 'string' },
                  { label: 'Cuerpo de la Noticia', name: 'body', widget: 'markdown' }
                ]
              }
            ]
          }
        });
      }
    });
  </script>
</body>
</html>
