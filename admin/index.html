<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Administración | CEPOCS</title>
  
  <!-- Usamos una pasarela que se integra en tu propio subdominio para saltar la seguridad -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/decap-cms/3.0.12/decap-cms.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
  <div id="nc-root"></div>
  <script>
    // Inicialización interna directa
    window.addEventListener('load', () => {
      if (typeof CMS === 'undefined') {
        // Si sigue bloqueado, forzamos la carga alternativa de emergencia
        var script = document.createElement('script');
        script.src = "https://pagecdn.io/default/libs/decap-cms/3.0.12/decap-cms.js";
        script.onload = () => { iniciarCMS(); };
        document.head.appendChild(script);
      } else {
        iniciarCMS();
      }
    });

    function iniciarCMS() {
      CMS.init({
        config: {
          backend: {
            name: 'github',
            repo: 'jngil83-droid/Cepocs',
            branch: 'main',
            local_backend: true
          },
          media_folder: 'assets/img/noticias',
          public_folder: '/assets/img/noticias',
          collections: [
            {
              name: 'noticias',
              label: 'Noticias',
              folder: 'content/noticias',
              create: true,
              slug: '{{year}}-{{month}}-{{day}}-{{slug}}',
              format: 'json',
              fields: [
                { label: 'Titular', name: 'title', widget: 'string' },
                { label: 'Fecha de Publicación', name: 'date', widget: 'datetime', format: 'YYYY-MM-DD' },
                { label: 'Autor/a', name: 'author', widget: 'string', default: 'CEPOCS' },
                { label: 'Foto de Portada', name: 'image', widget: 'image', required: true },
                { label: 'Resumen Corto', name: 'description', widget: 'string' },
                { label: 'Cuerpo de la Noticia', name: 'body', widget: 'markdown' }
              ]
            }
          ]
        }
      });
    }
  </script>
</body>
</html>
